components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas: {}
  parameters: {}
paths:
  /patients:
    get:
      tags:
        - patient
      description: Get a paged array of patients
      summary: Get a paged array of patients
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            nullable: true
            description: The starting object id of the next page
            example: 200
          required: false
          name: id_gt
          in: query
        - schema:
            type: integer
            nullable: true
            description: The starting object id of the previous page
            example: 100
          required: false
          name: id_lt
          in: query
        - schema:
            type: string
            nullable: true
            description: Search for objects updated after this date time
            example: 2023-07-30T09:00:00Z
          required: false
          name: update_gt
          in: query
        - schema:
            type: string
            nullable: true
            description: Search for objects updated before this date time
            example: 2023-07-30T09:00:00Z
          required: false
          name: update_lt
          in: query
        - schema:
            type: string
            nullable: true
            enum: &a4
              - "true"
              - "false"
            default: false
            description: Whether archived objects should be retrieved, default is false
          required: false
          name: include_archived
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient firstname
            example: Harry
          required: false
          name: firstname
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient lastname
            example: Potter
          required: false
          name: lastname
          in: query
        - schema:
            type: string
            nullable: true
            format: email
            description: Patient email
            example: harry@hogwarts.edu
          required: false
          name: email
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient birth date in YYYY-MM-DD format
            example: 1990-01-01
          required: false
          name: birthdate
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient phone number without country code
            example: "0412345678"
          required: false
          name: phoneNumber
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient tag
            example: Self-managed
          required: false
          name: patientTag
          in: query
      responses:
        "200":
          description: A paged array of patients
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: integer
                          minimum: 0
                          exclusiveMinimum: true
                          description: Patient Id
                          example: 1
                        firstname:
                          type: string
                          description: Patient first name
                          example: Harry
                        lastname:
                          type: string
                          description: Patient last name
                          example: Potter
                        middleName:
                          type: string
                          nullable: true
                          description: Patient middle name
                          example: James
                        preferredName:
                          type: string
                          nullable: true
                          description: Patient preferred name
                          example: Harry
                        title:
                          type: string
                          nullable: true
                          description: Patient title
                          example: Mr.
                        email:
                          type: string
                          nullable: true
                          description: Patient email
                          example: harry@hogwarts.edu
                        sex:
                          type: string
                          nullable: true
                          description: Patient sex
                          example: Male
                        genderIdentity:
                          type: string
                          nullable: true
                          description: Patient gender identity
                          example: Man
                        pronouns:
                          type: string
                          nullable: true
                          description: Patient pronouns
                          example: They/them
                        alert:
                          type: string
                          nullable: true
                          description: Patient alert messages
                          example: He knows magic
                        birthdate:
                          type: string
                          nullable: true
                          description: Patient birthdate in YYYY-MM-DD format
                          example: 1996-07-30
                        timezone:
                          type: string
                          nullable: true
                          description: Patient timezone
                          example: Australia/Adelaide
                        extraInfo:
                          type: string
                          nullable: true
                          description: Patient extra info
                          example: Some extra info
                        extraBillingInfo:
                          type: string
                          nullable: true
                          description: Patient extra billing info
                          example: Some extra billing info
                        addressL1:
                          type: string
                          nullable: true
                          description: Patient address line 1
                          example: 123 King William Street
                        addressL2:
                          type: string
                          nullable: true
                          description: Patient address line 2
                          example: ""
                        addressL3:
                          type: string
                          nullable: true
                          description: Patient address line 3
                          example: ""
                        city:
                          type: string
                          nullable: true
                          description: Patient city
                          example: Adelaide
                        state:
                          type: string
                          nullable: true
                          description: Patient state
                          example: SA
                        postalCode:
                          type: string
                          nullable: true
                          description: Patient post code
                          example: "5000"
                        country:
                          type: string
                          nullable: true
                          description: Patient country
                          example: Australia
                        phoneNumbers:
                          type: array
                          items:
                            type: object
                            properties:
                              type:
                                type: string
                                nullable: true
                                enum: &a1
                                  - Mobile
                                  - Home
                                  - Work
                                  - Fax
                                  - Other
                                description: Phone number type
                                example: Mobile
                              code:
                                type: string
                                nullable: true
                                description: Phone country code
                                example: "+61"
                              phoneNumber:
                                type: string
                                description: Phone number
                                example: "401234567"
                            required:
                              - type
                              - code
                              - phoneNumber
                        privacyPolicy:
                          type: string
                          nullable: true
                          enum: &a2
                            - No response
                            - Accepted
                            - Rejected
                          description: Patient privacy policy status
                          example: Accepted
                        healthFund:
                          type: object
                          properties:
                            name:
                              type: string
                              description: Health fund name
                              example: AHM
                            membershipNumber:
                              type: string
                              description: Health fund membership number
                              example: "12345678"
                            patientNumber:
                              type: string
                              description: Health fund patient number
                              example: "1"
                            cardIssueNumber:
                              type: string
                              description: Health fund card issue number
                              example: "01"
                          required:
                            - name
                        ndisNumber:
                          type: string
                          nullable: true
                          description: Patient NDIS number
                          example: "430123456"
                        medicareNum:
                          type: string
                          nullable: true
                          description: Patient Medicare number
                          example: "4444444444"
                        irn:
                          type: string
                          nullable: true
                          description: Patient Medicare reference number
                          example: "1"
                        veteransFileNumber:
                          type: string
                          nullable: true
                          description: Patient veterans information
                          example: ""
                        emergencyContactNumber:
                          type: string
                          nullable: true
                          description: Patient emergency contact number
                          example: "0412345678"
                        emergencyContactName:
                          type: string
                          nullable: true
                          description: Patient emergency contact name
                          example: Quentin Neely
                        emergencyContactRelationship:
                          type: string
                          nullable: true
                          description: Patient emergency contact relationship
                          example: Brother
                        patientTags:
                          type: array
                          items:
                            type: string
                          description: Patient tags
                          example: &a3
                            - Self-managed
                        archived:
                          type: boolean
                          nullable: true
                          default: false
                          description: Whether the patient has been archived
                        createdAt:
                          type: string
                          nullable: true
                          description: Object creation date time
                          example: 2023-07-30T09:00:00Z
                        updatedAt:
                          type: string
                          nullable: true
                          description: Object update date time
                          example: 2023-07-30T09:00:00Z
                      required:
                        - id
                        - firstname
                        - lastname
                        - middleName
                        - preferredName
                        - title
                        - email
                        - sex
                        - genderIdentity
                        - pronouns
                        - alert
                        - birthdate
                        - timezone
                        - extraInfo
                        - extraBillingInfo
                        - addressL1
                        - addressL2
                        - addressL3
                        - city
                        - state
                        - postalCode
                        - country
                        - phoneNumbers
                        - privacyPolicy
                        - ndisNumber
                        - medicareNum
                        - irn
                        - veteransFileNumber
                        - emergencyContactNumber
                        - emergencyContactName
                        - emergencyContactRelationship
                        - patientTags
                        - createdAt
                        - updatedAt
                  links:
                    type: object
                    properties:
                      previousPage:
                        type: string
                        description: The link to retrieve next page
                        example: /v1/${object_type}?id_gt=200
                      nextPage:
                        type: string
                        description: The link to retrieve previous page
                        example: /v1/${object_type}?id_lt=100
                required:
                  - data
                  - links
