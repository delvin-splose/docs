  /patients:
    get:
      tags:
        - patient
      description: Get a paged array of patients
      summary: Get a paged array of patients
      security:
        - bearerAuth: []
      parameters:
        - schema:
            type: integer
            nullable: true
            description: The starting object id of the next page
            example: 200
          required: false
          name: id_gt
          in: query
        - schema:
            type: integer
            nullable: true
            description: The starting object id of the previous page
            example: 100
          required: false
          name: id_lt
          in: query
        - schema:
            anyOf:
              - type: string
              - type: string
            description: Search for objects updated after this date time
            example: 2023-07-30T09:00:00Z
          required: false
          name: update_gt
          in: query
        - schema:
            anyOf:
              - type: string
              - type: string
            description: Search for objects updated before this date time
            example: 2023-07-30T09:00:00Z
          required: false
          name: update_lt
          in: query
        - schema:
            type: string
            nullable: true
            enum: &a4
              - "true"
              - "false"
            default: "false"
            description: Whether archived objects should be retrieved, default is false
          required: false
          name: include_archived
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient firstname
            example: Harry
          required: false
          name: firstname
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient lastname
            example: Potter
          required: false
          name: lastname
          in: query
        - schema:
            type: string
            nullable: true
            format: email
            description: Patient email
            example: harry@hogwarts.edu
          required: false
          name: email
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient birth date in YYYY-MM-DD format
            example: 1990-01-01
          required: false
          name: birthdate
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient phone number without country code
            example: "0412345678"
          required: false
          name: phoneNumber
          in: query
        - schema:
            type: string
            nullable: true
            description: Patient tag
            example: Self-managed
          required: false
          name: patientTag
          in: query
